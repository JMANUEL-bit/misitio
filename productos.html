<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller del Árbol - Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="productos.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <img src="logo_car.png" alt="Logo Taller del Árbol" class="logo-img">
            </a>
            <div class="brand-title">
                <h1>Taller del árbol</h1>
            </div>
            <a href="carrito.html" class="cart-link" aria-label="Ver carrito">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>
    </header>

    <main class="products-main">
        <div class="filter-bar">
            <div class="filter-group">
                <select class="filter-pill" aria-label="Filtrar por color">
                    <option value="">Color</option>
                    <option value="nogal">Nogal</option>
                    <option value="roble">Roble</option>
                    <option value="blanco">Blanco</option>
                </select>
            </div>

            <div class="filter-group">
                <select class="filter-pill" aria-label="Filtrar por material">
                    <option value="">Material</option>
                    <option value="pino">Madera de Pino</option>
                    <option value="cedro">Cedro</option>
                    <option value="mdf">MDF</option>
                </select>
            </div>

            <div class="filter-group">
                <select class="filter-pill" aria-label="Filtrar por precio">
                    <option value="">Precio</option>
                    <option value="menor">$1,000 - $3,000</option>
                    <option value="medio">$3,000 - $6,000</option>
                    <option value="mayor">Más de $6,000</option>
                </select>
            </div>
        </div>

        <section class="products-grid">
            <a href="detalle.html?id=0" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-table"></i>
                    </div>
                    <h3>Mesa Clásica</h3>
                    <p class="product-price">$2,800</p>
                </article>
            </a>

            <a href="detalle.html?id=1" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-couch"></i>
                    </div>
                    <h3>Sillón Individual</h3>
                    <p class="product-price">$3,500</p>
                </article>
            </a>

            <a href="detalle.html?id=2" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-desktop"></i>
                    </div>
                    <h3>Escritorio Ejecutivo</h3>
                    <p class="product-price">$4,200</p>
                </article>
            </a>

            <a href="detalle.html?id=3" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-bed"></i>
                    </div>
                    <h3>Base de Cama</h3>
                    <p class="product-price">$5,400</p>
                </article>
            </a>

            <a href="detalle.html?id=4" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-chair"></i>
                    </div>
                    <h3>Silla Comedor</h3>
                    <p class="product-price">$1,200</p>
                </article>
            </a>

            <a href="detalle.html?id=5" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <h3>Estante Librero</h3>
                    <p class="product-price">$3,100</p>
                </article>
            </a>

            <a href="detalle.html?id=6" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-door-closed"></i>
                    </div>
                    <h3>Ropero Clásico</h3>
                    <p class="product-price">$6,800</p>
                </article>
            </a>

            <a href="detalle.html?id=7" class="product-link">
                <article class="product-card">
                    <div class="product-icon">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <h3>Buró de Noche</h3>
                    <p class="product-price">$1,650</p>
                </article>
            </a>
        </section>
    </main>

    <footer class="site-footer">
        <div class="social-icons">
            <a href="https://www.facebook.com/" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://web.whatsapp.com/" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
        <div class="footer-links">
            <a href="#">Política de privacidad</a> | 
            <a href="#">Términos y condiciones</a> | 
            <a href="#">Acerca de CARPINTERÍA</a> | 
            <a href="#">Contacto</a>
        </div>
    </footer>

</body>
</html>
